openapi: 3.0.3
info:
  title: API de Adoção de Animais
  version: 1.0.0
  description: |
    API REST em que ONGs cadastram animais e interessados filtram por porte, idade e cidade
    e enviam pedidos de adoção.

    **Regras de negócio**
    1. Só é possível selecionar (listar/consultar) animais estando logado.
    2. Para fazer login é necessário ter cadastro.
    3. Um adotante só pode enviar um pedido de adoção se não tiver nenhum outro pedido pendente.

    **Usuários de teste** (senha `123456`): `ong@patasamigas.org` (ONG), `maria@email.com` (adotante),
    `joao@email.com` (adotante com pedido pendente).

    Para usar as rotas protegidas, faça login em `POST /auth/login`, copie o `token` e clique em **Authorize**.
servers:
  - url: http://localhost:3000/api
    description: Servidor local
tags:
  - name: Autenticação
    description: Cadastro e login
  - name: Animais
    description: Seleção e cadastro de animais
  - name: Pedidos
    description: Pedidos de adoção

paths:
  /auth/cadastro:
    post:
      tags: [Autenticação]
      summary: Cadastra um novo usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroInput'
            example:
              nome: Ana Costa
              email: ana@email.com
              senha: '123456'
              cidade: São Paulo
              telefone: (11) 91234-5678
              tipo: adotante
      responses:
        '201':
          description: Usuário cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Realiza login e retorna um token JWT
      description: Regra de negócio 2 — o usuário precisa estar cadastrado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            example:
              email: maria@email.com
              senha: '123456'
      responses:
        '200':
          description: Login realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResposta'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          description: Senha incorreta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '404':
          description: Usuário não cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Retorna o usuário logado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário logado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /animais:
    get:
      tags: [Animais]
      summary: Lista animais disponíveis, com filtros
      description: Regra de negócio 1 — requer login.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: porte
          schema:
            type: string
            enum: [pequeno, medio, grande]
        - in: query
          name: idadeMin
          description: Idade mínima em anos
          schema:
            type: number
            minimum: 0
        - in: query
          name: idadeMax
          description: Idade máxima em anos
          schema:
            type: number
            minimum: 0
        - in: query
          name: cidade
          description: Cidade (comparação exata, sem diferenciar maiúsculas/minúsculas)
          schema:
            type: string
          example: São Paulo
        - in: query
          name: especie
          schema:
            type: string
            enum: [cachorro, gato, outro]
      responses:
        '200':
          description: Lista de animais
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Animal'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
    post:
      tags: [Animais]
      summary: Cadastra um animal (somente ONG)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalInput'
            example:
              nome: Luna
              especie: gato
              porte: pequeno
              idade: 3
              cidade: Campinas
              descricao: Gata carinhosa e vacinada.
              fotoUrl: /img/gato.svg
      responses:
        '201':
          description: Animal cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'

  /animais/{id}:
    get:
      tags: [Animais]
      summary: Detalha um animal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Animal encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /pedidos:
    post:
      tags: [Pedidos]
      summary: Finaliza um pedido de adoção (somente adotante)
      description: Regra de negócio 3 — o adotante não pode ter outro pedido pendente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoInput'
      responses:
        '201':
          description: Pedido criado com status pendente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Usuário já possui pedido pendente
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                  pedidoPendenteId:
                    type: string
        '422':
          description: Animal não está disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    get:
      tags: [Pedidos]
      summary: Lista pedidos do adotante logado ou recebidos pela ONG logada
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'

  /pedidos/{id}:
    patch:
      tags: [Pedidos]
      summary: ONG aprova ou recusa um pedido pendente
      description: Ao aprovar, o animal passa a "adotado" e os demais pedidos pendentes dele são recusados.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [aprovado, recusado]
      responses:
        '200':
          description: Pedido atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          description: Pedido já respondido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: string

  responses:
    RequisicaoInvalida:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: Usuário não está logado (token ausente, inválido ou expirado)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Proibido:
      description: Tipo de usuário sem permissão para a ação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
    CadastroInput:
      type: object
      required: [nome, email, senha, cidade]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          minLength: 6
        cidade:
          type: string
        telefone:
          type: string
        tipo:
          type: string
          enum: [adotante, ong]
          default: adotante
    LoginInput:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
    LoginResposta:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: '#/components/schemas/Usuario'
    Usuario:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
        cidade:
          type: string
        telefone:
          type: string
        tipo:
          type: string
          enum: [adotante, ong]
    AnimalInput:
      type: object
      required: [nome, especie, porte, idade, cidade]
      properties:
        nome:
          type: string
        especie:
          type: string
          enum: [cachorro, gato, outro]
        porte:
          type: string
          enum: [pequeno, medio, grande]
        idade:
          type: number
          minimum: 0
          description: Idade em anos
        cidade:
          type: string
        descricao:
          type: string
        fotoUrl:
          type: string
          description: URL da foto (absoluta ou relativa ao site, ex. /img/rex.svg)
    Animal:
      allOf:
        - $ref: '#/components/schemas/AnimalInput'
        - type: object
          properties:
            _id:
              type: string
            status:
              type: string
              enum: [disponivel, adotado]
            ong:
              type: object
              properties:
                _id:
                  type: string
                nome:
                  type: string
                cidade:
                  type: string
                telefone:
                  type: string
            createdAt:
              type: string
              format: date-time
    PedidoInput:
      type: object
      required: [animalId]
      properties:
        animalId:
          type: string
        mensagem:
          type: string
          example: Tenho quintal grande e experiência com cães.
    Pedido:
      type: object
      properties:
        _id:
          type: string
        usuario:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Usuario'
        animal:
          oneOf:
            - type: string
            - $ref: '#/components/schemas/Animal'
        mensagem:
          type: string
        status:
          type: string
          enum: [pendente, aprovado, recusado]
        createdAt:
          type: string
          format: date-time
